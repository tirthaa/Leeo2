services:
  selenium-hub5:
    image: selenium/hub:latest
    container_name: selenium-hub5
    ports:
      - "4441:4441"
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
      
  real_device:
    image: appium/appium
    depends_on:
      - selenium-hub5
    network_mode: "service:selenium-hub5"
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ~/.android:/root/.android
      - $PWD/example/sample_apk:/root/tmp
    environment:
      - CONNECT_TO_GRID=true
      - SELENIUM_HOST=selenium-hub5
      - RELAXED_SECURITY=true
  
  nexus_7.1.1:
    image: oklabs/docker-android-x86-7.1.1:latest
    privileged: true
    scale: 1
    depends_on:
      - selenium-hub5
      - real_device
    ports:
      - 6080:6080
      - 4723:4723
      - 5554:5554
      - 5555:5555
    volumes:
      - $PWD/example/sample_apk:/root/tmp/sample_apk
      - ./video-nexus_7.1.1:/tmp/video
    environment:
      - DEVICE=Nexus 5
      - CONNECT_TO_GRID=true
      - APPIUM=true
      - SELENIUM_HOST=selenium-hub5
      - AUTO_RECORD=true
